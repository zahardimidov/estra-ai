---
test_name: API Keys - unauthorized without token

stages:
  - name: POST /v1/apikeys without Authorization returns 403
    request:
      url: "{host}/v1/apikeys"
      method: POST
      json:
        name: "prod"
    response:
      status_code: 403

---
test_name: API Keys - create returns raw key once

stages:
  - name: Register user
    request:
      url: "{host}/v1/auth/sign-up"
      method: POST
      json:
        email: "apikey_create_user@example.com"
        password: "TestPass1!"
        password_repeat: "TestPass1!"
    response:
      status_code: 200
      save:
        json:
          auth_token: token

  - name: POST /v1/apikeys returns 201 with raw key
    request:
      url: "{host}/v1/apikeys"
      method: POST
      headers:
        Authorization: "Bearer {auth_token}"
      json:
        name: "prod"
        request_limit: 500
    response:
      status_code: 201
      json:
        id: !anystr
        name: "prod"
        key: !anystr
        request_limit: 500
        created_at: !anystr

---
test_name: API Keys - list only returns own keys

stages:
  - name: Register user
    request:
      url: "{host}/v1/auth/sign-up"
      method: POST
      json:
        email: "apikey_list_user@example.com"
        password: "TestPass1!"
        password_repeat: "TestPass1!"
    response:
      status_code: 200
      save:
        json:
          auth_token: token

  - name: Create a key
    request:
      url: "{host}/v1/apikeys"
      method: POST
      headers:
        Authorization: "Bearer {auth_token}"
      json:
        name: "listed-key"
    response:
      status_code: 201

  - name: GET /v1/apikeys returns created key without raw value
    request:
      url: "{host}/v1/apikeys"
      method: GET
      headers:
        Authorization: "Bearer {auth_token}"
    response:
      status_code: 200
      json:
        - id: !anystr
          name: "listed-key"
          is_active: true
          request_limit: 1000
          created_at: !anystr

---
test_name: API Keys - delete removes key

stages:
  - name: Register user
    request:
      url: "{host}/v1/auth/sign-up"
      method: POST
      json:
        email: "apikey_delete_user@example.com"
        password: "TestPass1!"
        password_repeat: "TestPass1!"
    response:
      status_code: 200
      save:
        json:
          auth_token: token

  - name: Create a key
    request:
      url: "{host}/v1/apikeys"
      method: POST
      headers:
        Authorization: "Bearer {auth_token}"
      json:
        name: "to-delete"
    response:
      status_code: 201
      save:
        json:
          created_key_id: id

  - name: DELETE /v1/apikeys/<id> returns 204
    request:
      url: "{host}/v1/apikeys/{created_key_id}"
      method: DELETE
      headers:
        Authorization: "Bearer {auth_token}"
    response:
      status_code: 204

  - name: GET /v1/apikeys no longer lists deleted key
    request:
      url: "{host}/v1/apikeys"
      method: GET
      headers:
        Authorization: "Bearer {auth_token}"
    response:
      status_code: 200
      json: []

