events {}

http {
    # Docker's embedded DNS — re-resolve on every request instead of caching
    # a single upstream IP at startup, so `docker compose up --scale api=N`
    # is actually load-balanced (round-robin) without an nginx restart.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location / {
            set $upstream api:8000;
            proxy_pass http://$upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
